<!doctype html>
<html lang="en" class="bg-ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lead inbox — Double Take</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..800&family=Golos+Text:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
<script type="module" src="/assets/js/admin.js"></script>
</head>
<body>

<header class="border-b border-edge">
  <div class="shell flex flex-wrap items-center gap-4 py-4">
    <a href="/" class="flex items-baseline gap-1.5 font-display text-[19px] font-medium tracking-[-0.05em]">
      double take
      <span class="inline-block size-1.5 rounded-full bg-flare shadow-[0_0_12px_#ff6a1a]"></span>
    </a>
    <p class="eyebrow">Lead inbox</p>
    <p class="eyebrow ml-auto" data-count>—</p>
  </div>
</header>

<main class="shell py-10">
  <form id="token-form" class="mb-8 flex flex-wrap items-end gap-3">
    <div class="min-w-[260px] flex-1">
      <label class="field-label" for="token">Admin token</label>
      <input class="field font-mono text-[13px]" id="token" name="token" type="password"
             autocomplete="off" placeholder="from your .env">
    </div>
    <button type="submit" class="btn btn-flare">Load leads</button>
    <button type="button" class="btn" data-forget>Forget token</button>
  </form>

  <p class="mb-6 text-sm text-mist" role="status" aria-live="polite" data-status>
    Paste the token from <code class="font-mono text-flare-hi">ADMIN_TOKEN</code> to read the inbox.
  </p>

  <div class="overflow-x-auto border border-edge bg-ink-2" hidden data-table-wrap>
    <table class="w-full border-collapse text-left text-sm">
      <thead>
        <tr class="border-b border-edge">
          <th class="p-3 font-mono text-[10px] tracking-[0.14em] text-ash uppercase">Received</th>
          <th class="p-3 font-mono text-[10px] tracking-[0.14em] text-ash uppercase">Name</th>
          <th class="p-3 font-mono text-[10px] tracking-[0.14em] text-ash uppercase">Email</th>
          <th class="p-3 font-mono text-[10px] tracking-[0.14em] text-ash uppercase">Plan</th>
          <th class="p-3 font-mono text-[10px] tracking-[0.14em] text-ash uppercase">Profile</th>
          <th class="p-3 font-mono text-[10px] tracking-[0.14em] text-ash uppercase">Message</th>
        </tr>
      </thead>
      <tbody data-rows></tbody>
    </table>
  </div>
</main>

</body>
</html>
